name: Publish

# Publishes to pub.dev when a version tag is pushed, through pub.dev's
# automated publishing: GitHub signs the request, so no token lives in the
# repository. pub.dev only accepts it for tags matching the pattern set in the
# package's admin page (v{{version}}).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the pubspec version
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi
      # Exchanges the GitHub identity for a pub.dev token.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
