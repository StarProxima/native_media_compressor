name: native_media_compressor_example
description: "Compress video and images with the codecs your platform already ships."
publish_to: 'none'

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  native_media_compressor:
    path: ../
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - integration_test/fixtures/
